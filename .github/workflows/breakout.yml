name: generate breakout svg

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-svg:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate breakout SVGs
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}

      - name: Stage generated SVGs
        run: |
          mkdir -p /tmp/breakout-images
          mv output/light.svg /tmp/breakout-images/breakout-light.svg
          mv output/dark.svg /tmp/breakout-images/breakout-dark.svg

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Published to a dedicated orphan branch so the README can reference the
      # SVGs by raw URL without carrying generated binaries on main.
      - name: Commit and force-push SVGs to the breakout branch
        run: |
          git checkout --orphan breakout
          git rm -rf . > /dev/null
          mkdir images
          mv /tmp/breakout-images/* images/
          git add images
          git commit -m "chore: update breakout SVGs" || echo "No changes to commit"
          git push --force origin breakout
